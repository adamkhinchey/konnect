<div class="modal-header">
  <h4 class="modal-title">Bulk Import/Export</h4>
  <!-- <button type="button" class="close" aria-label="Close" (click)="dismiss()">
        <span aria-hidden="true">&times;</span>
    </button> -->
</div>
<div class="modal-body">

  <div class="importExportBtn">


    <!-- <div class="mb-3">
            <label for="formFileSm" class="form-label">Import file from</label>
            <input class="form-control form-control-sm" id="formFileSm" type="file">
          </div> -->
    <label for="formFileSm" class="form-label">Import file</label>
    <div class="input-group">
      <div class="custom-file">
        <input class="custom-file-input" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04"
          appFileUploadTrigger [fileUploadComponentRef]="fileUploadComponent">
        <label class="custom-file-label" for="inputGroupFile04">{{fileName ? fileName : 'Choose xlsx file'}}</label>
        <app-file-upload #fileUploadComponent [config]="fileConfig" [showValidFileTypeList]="true"
        (fileChange)="fileSelected($event)"></app-file-upload>
      </div>
      
    </div>

    <a [href]="type == 'services' ? 'https://dev-konnectapp-media.s3.ap-southeast-2.amazonaws.com/SampleFiles/konnect_services.xlsx' : type == 'exhibitors' ? 'https://dev-konnectapp-media.s3.ap-southeast-2.amazonaws.com/SampleFiles/konnect_exhibitors.xlsx':''"
      target="_blank" class="mt-3"> <i class="download icon"></i> Download template file </a>

    <hr>

    <!-- <div class="input-group-append">
      <button class="btn btn-warning" type="button" id="inputGroupFileAddon04">Import</button>
    </div> -->
    <a style="width: 100%;" id="inputGroupFileAddon04" class="ui button" (click)="importData()"> <i class="upload icon"></i> Import Data</a>
    <!--     
         <label for="import" class="btn btn-info importBtn" ><i class="upload icon"></i> Export </label>
         <input type="file" id="import" /> -->
  </div>


</div>
<div class="modal-footer justify-content-between">
  <!-- <button type="button" class="ui button positive" >Cancel</button> -->
  <a (click)="exportData()" class="ui button basic blue negative"> <i class="download icon"></i> Export data </a>
  <button type="button" class="ui button basic blue negative ml-2" (click)="dismiss()">Cancel</button>
</div>
