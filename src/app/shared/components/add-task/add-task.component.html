<div class="addTaskModal">
    <div class="row">
        <div class="col-md-12 mb-3">
            <p>
                Owned by: {{ownedByText}}
                <a href="javaScript:void()" (click)="dismiss()"> <i class="close icon"></i> </a>
            </p>
        </div>
    </div>
    <form [formGroup]="addTaskForm">
        <div class="row">
            <div class="col-md-7">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" placeholder="" class="form-control" formControlName="title" [readonly]="f.taskId.value > 0 && taskData.isTaskOwner == 0">
                    <div class="text-danger" *ngIf="
                    f.title.hasError('required') &&
                    (f.title.touched || submitted)
                  ">
                        Title is required &nbsp;
                    </div>
                    <div class="text-danger" *ngIf="
                    f.title.hasError('whitespace') &&
                    (f.title.touched || submitted) &&
                    !f.title.hasError('required')
                  ">
                        Enter valid data &nbsp;
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <angular-editor formControlName="description" [config]="config" (focus)="changeConfig()">
                    </angular-editor>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <div class="ui grid">
                        <div class="six wide column">
                            <!-- <input type="text" placeholder="" class="form-control" formControlName="dueDate"> -->
                            <input #inptask class="form-control shadow-input" formControlName="dueDate" [owlDateTime]="dt1"
                                placeholder="Due Date" [min]="minimumDate" (dateTimeChange)="setDateTime($event)">

                            <input type="text" class="form-control timeWindowDate"
                                [value]="f.dueDate.value | dateFilter: 'dd/MM/YYYY'" formControlName="dueDate"
                                [owlDateTimeTrigger]="dt1" placeholder="" (dateTimeChange)="setDateTime($event)">

                            <owl-date-time #dt1 [pickerType]="'calendar'" [disabled]="f.taskId.value > 0 && taskData.isTaskOwner == 0"></owl-date-time>
                        </div>
                        <div (click)="removeDate()" *ngIf="f.taskId.value == 0 || taskData.isTaskOwner == 1">
                            <a class="ui button basic circular compact mini trashIconOuter"><i
                                    class="m-0 trash alternate icon"></i></a>
                        </div>
                    </div>

                </div>


                <div class="ui grid">
                    <div class="seven wide column">
                        <div class="ui checkbox">
                            <input type="checkbox" id="completed" class="hidden" tabindex="0"
                                formControlName="isCompleted" [attr.disabled]="f.taskId.value > 0 && taskData.isTaskOwner == 0">
                            <label for="completed">Completed</label>
                        </div>
                    </div>
                    <div class="nine wide column right aligned">
                        <!-- only editable when have all permission or restricted permission to client  -->
                        <div class="ui circular compact mini basic button confirmRemove hasModal" (click)="removeTask()" *ngIf="f.taskId.value > 0 && taskData.isTaskOwner == 1">
                            <i class="trash alternate icon"></i>Remove
                        </div>

                        <button class="ui button ml-2" (click)="saveUpdateTask()"  *ngIf="f.taskId.value == 0 || taskData.isTaskOwner == 1"> Save </button>

                    </div>
                </div>

            </div>
            <div class="col-md-5">
                <div class="form-group">
                    <label class="w-100" *ngIf="f.taskId.value == 0 || taskData.isTaskOwner == 1"> &nbsp; </label>
                    <button class="ui button ml-2" (click)="assignTo()" *ngIf="f.taskId.value == 0 || taskData.isTaskOwner == 1"> Assigned to </button>
                    <!-- <div>
                        <ng-multiselect-dropdown [placeholder]="'custom placeholder'" [settings]="dropdownSettings"
                            [data]="dropdownList" [(ngModel)]="selectedItems" (onSelect)="onItemSelect($event)">
                        </ng-multiselect-dropdown>
                    </div> -->
                    <div class="assigntoData" *ngIf="assignToData && assignToData.length">
                        <p class="mt-1 mb-2" [ngClass]="role.isCompleted == 1 ? 'completedLabel' : ''" *ngFor="let role of assignToData">{{role.companyName}}</p>
                        <!-- <p class="mt-1 mb-2">functionRole, companyName</p> -->
                    </div>
                    <div style="padding-left: 7px; padding-top: 5px;" class="text-danger" *ngIf="
                    !assignToData.length && submitted
                  ">
                        Select atleast one company &nbsp;
                    </div>
                    <!-- <p>functionRole, companyName</p>
                    <p>functionRole, companyName</p> -->
                </div>
            </div>
        </div>
    </form>
</div>
