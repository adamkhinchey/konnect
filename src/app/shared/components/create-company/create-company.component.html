<div class="ui middle aligned center aligned grid">
  <div class="column minContainer marginT50 marginB30">
    <h2 *ngIf="createCompanyMode.type.soleTrader" class="segmentTitle">
      Sole Trader/Proprietor Details
    </h2>
    <h2 *ngIf="createCompanyMode.type.inc" class="segmentTitle">
      Company Details
    </h2>
    <form class="ui form" [formGroup]="createCompanyForm">
      <div class="ui stacked">
        <div class="ui grid stackable">
          <div class="row">
            <div class="eight wide column">
              <div class="uploadImage">
                <i class="upload icon"></i>
              </div>
              <div class="ui button basic small compact blue">
                <label for="select-company-image" [ngStyle]="{'marginBottom':0}">Choose profile image</label>
                <input id="select-company-image" type="file" hidden formControlName="companyProfileImage"/>
              </div>
            </div>
          </div>
          <div class="sixteen wide column left aligned">
            <div class="field required">
              <label>{{createCompanyMode.type.soleTrader ? 'Trading Name' : 'Company Name'}}</label>
              <input type="text" name="first-name"
                     placeholder="Trading/Company Name"
                     required formControlName="companyName">
            </div>
            <span
              *ngIf="createCompanyForm!.get('companyName')?.touched
          && createCompanyForm!.get('companyName')?.errors?.required"
              class="text-danger"
            >{{createCompanyMode.type.soleTrader ? 'Trading name is required' : 'Company name is required'}}</span>
          </div>
          <div class="eight wide column left aligned">
            <div class="field required">
              <label for="select-company-country">Country</label>
              <select id="select-company-country"
                      class="ui fluid dropdown selection"
                      formControlName="countryId" required>
                <option *ngFor="let cntr of countries$ | async" [ngValue]="cntr.val" [disabled]="!cntr.val">
                  {{ cntr.name }}
                </option>
              </select>
              <span class="text-danger"
                    *ngIf="createCompanyForm!.get('countryId')?.touched &&
                (createCompanyForm!.get('countryId')?.hasError('required'))">
                Country is required</span>
            </div>
          </div>
          <div class="eight wide column left aligned">
            <div class="field required">
              <label>City</label>
              <input type="text" placeholder="City" required formControlName="city">
              <span
                *ngIf="createCompanyForm!.get('city')?.touched &&
                (createCompanyForm!.get('city')?.hasError('required'))"
                class="text-danger"
              >City is required</span>
            </div>
          </div>
          <div class="sixteen wide column left aligned">
            <div class="column">
              <div class="field required" (click)="markCategoryTouched()">
                <label>Category</label>
                <ng-multiselect-dropdown
                  [ngModelOptions]="{standalone:true}"
                  [placeholder]="'Select one or more category'"
                  [settings]="dropdownSettings"
                  [data]="categoryList"
                  [(ngModel)]="selectedCategory"
                  (ngModelChange)="onCategoryChange($event)"
                ></ng-multiselect-dropdown>
                <span
                  *ngIf="createCompanyForm!.get('categoryIds')?.touched &&
                (createCompanyForm!.get('categoryIds')?.hasError('required'))"
                  class="text-danger"
                >At least one category has to be selected</span>

          <div class="sixteen wide column left aligned">
            <div class="field">

            </div>

          <div class="sixteen wide column paddingT0">
