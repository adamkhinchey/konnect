<div class="ui segment">
  <form class="ui form">
    <div class="ui grid stackable">
      <div class="seven wide column">
        <div class="companyContainer marginB20">
          <div class="field checkboxOnHeader">
            <div class="ui dividing header">
              <h3>Client Company <i class="globe icon"></i></h3>
            </div>
            <div class="ui checkbox">
              <input type="checkbox" class="hidden" tabindex="0">
              <label>My company</label>
            </div>
          </div>
          <div class="kcpCardContainer"></div>
        </div>
          <ng-content select="[assignFunctionCmp]"></ng-content>

        <!--</div>-->

      </div>
      <div class="nine wide column">
        <div class="ui dividing header">
          <h3>Event Details <i class="globe icon"></i></h3>
        </div>
        <div class="field required">
          <label>Event Title</label>
          <div class="field">
            <input type="text" placeholder="Event Title">
          </div>
        </div>
        <div class="field">
          <label>Event Description</label>
          <div class="textarea" contenteditable=""></div>
        </div>
        <div class="field">
          <div class="ui toggle checkbox toggleOnColumn">
            <input type="checkbox" name="exhibitors" class="hidden"
                   tabindex="0">
            <label>Event has exhibitors</label>
          </div>
        </div>
      </div>
      <div class="sixteen wide column saveButtons paddingT0">
        <div class="ui divider"></div>
        <div class="ui grid stackable">
          <div class="sixteen wide column right aligned">
            <div class="ui button hasModal" data-modal="inviteModal">Save &amp;
              Invite
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
