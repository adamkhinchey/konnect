<div class="ui segment">
  <form class="ui form">
    <div class="ui grid stackable">
      <div class="seven wide column">
        <div class="companyContainer marginB20">
          <div class="field checkboxOnHeader">
            <div class="ui dividing header">
              <h3>Client Company <i class="globe icon"></i></h3>
            </div>
            <div class="ui checkbox" (click)="toggleClientOwnCompany()">
              <input type="checkbox" class="hidden" tabindex="0" [(ngModel)]="isOwnCompany"
                     [ngModelOptions]="{standalone:true}">
              <label>My company</label>
            </div>
          </div>
          <div class="kcpCardContainer">
            <div *ngIf="selectedCompany" class="ui one column grid">
              <div class="column">
                <div class="ui fluid card">
                  <div class="content">
                    <img class="right floated mini ui image"
                         [src]="getCompanyProfileImage() || 'assets/img/default_konnect_img.png'"
                         appImageFallback fallbackImage="assets/img/default_konnect_img.png">
                    <div class="header">
                      <a (click)="goToCompanyProfile(getCompanyId())">{{selectedCompany.companyName}}</a>
                    </div>
                    <div class="meta">
                      <a *ngIf="getCompanyWebsite()" [href]="getCompanyWebsite()"
                         target="_blank"> {{getCompanyWebsite()}}</a>
                      <span *ngIf="getCompanyWebsite()">|</span>
                      <a>
                        <i class="map marker alternate icon"></i>{{selectedCompany.city}}</a>
                      <span>|</span>
                      <i class="phone icon"></i>{{getCompanyPhone() || ''}}
                    </div>
                  </div>
                  <div class="extra content" [ngClass]="{'editableObject':false}">
                    <div class="ui grid">
                      <div class="ten wide column">

                      </div>
                      <div class="six wide column right aligned">
                        <div (click)="removeSelectedCompany.emit()"
                             class="ui circular compact mini basic button confirmRemove hasModal"
                             data-modal="removeModal"><i class="trash alternate icon"></i>Remove
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <ng-content select="[assignFunctionCmp]"></ng-content>


        <!--</div>-->

      </div>
      <div class="nine wide column">
        <div class="ui dividing header">
          <h3>Event Details <i class="globe icon"></i></h3>
        </div>
        <div class="field required">
          <label>Event Title</label>
          <div class="field">
            <input type="text" placeholder="Event Title" [(ngModel)]="eventToBeSaved.title"
                   [ngModelOptions]="{standalone:true}">
          </div>
        </div>
        <div class="field">
          <label>Event Description</label>
          <textarea rows="3" class="textarea" [(ngModel)]="eventToBeSaved.description"
                    [ngModelOptions]="{standalone:true}"></textarea>
        </div>
        <div class="field">
          <div class="ui toggle checkbox toggleOnColumn"
               (click)="eventToBeSaved.hasExhibitors=!eventToBeSaved.hasExhibitors">
            <input type="checkbox" name="exhibitors" class="hidden"
                   tabindex="0" [(ngModel)]="eventToBeSaved.hasExhibitors" [ngModelOptions]="{standalone:true}">
            <label>Event has exhibitors</label>
          </div>
        </div>
      </div>
      <div class="sixteen wide column saveButtons paddingT0">
        <div class="ui divider"></div>
        <div class="ui grid stackable">
          <div class="sixteen wide column right aligned">
            <div class="ui button hasModal" data-modal="inviteModal" (click)="saveAndInvite.emit(true)">Save &amp;
              Invite
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
