<div class="ui grid center aligned" *ngIf="!selectedCompany">
  <div class="sixteen wide column">
    <div class="ui button basic blue fluid addClient hasModal"
         (click)="openVerticallyCentered(clientCompanyModal)">
      <i class="plus circle icon"></i>{{clientCmpBtnLabel}}
    </div>
  </div>
</div>
<div class="contactsContainer">
  <div class="ui dividing header">
    <h3>{{contactListLabel}} <i class="globe icon"></i></h3>
  </div>
  <div class="kipCardContainer">
    <div  *ngIf="contactList && contactList.length>0" class="ui one column grid stackable">
      <div class="column" *ngFor="let contact of contactList; let i=index">
        <div class="contactRole">{{contactLabels.get(contact.contactLabelId) || ''}}
          <div class="hidden ui circular compact mini basic icon button editProfileBtn hasModal" (click)="editContactModal(editContactDetail)">
            <i class="pencil alternate icon"></i>
          </div>
        </div>
        <div class="ui fluid card">
          <div class="content">
            <img class="right floated mini ui image" [src]="contact.profileImage || 'assets/img/profile.png'"
                 appImageFallback fallbackImage="assets/img/profile.png">
            <div class="header">
              <a>{{contact.firstName + ' '+ (contact.lastName || '')}}</a>
            </div>
            <div class="meta">
              {{contact.position}}
            </div>
            <div class="description">
              {{contact.email}}<br>
              {{contact.mobile}}
            </div>
          </div>
          <div class="extra content">
            <div class="ui grid">
              <div class="eight wide column">

              </div>
              <div class="eight wide column right aligned">
                <div class="ui circular compact mini basic button confirmRemove hasModal"
                     (click)="removeContactFromList(i)"
                     data-modal="removeModal"><i class="trash alternate icon"></i>Remove</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="ui grid center aligned">
    <div class="sixteen wide column">
      <div class="ui basic button blue fluid addContacts hasModal"
           (click)="openVerticallyCentered(contactModal)"
           [ngClass]="{disabled: disableAddContacts }"
           data-modal="contacts">
        <i class="plus circle icon"></i>Add Contact
      </div>
    </div>
  </div>

  
  <ng-template #editContactDetail let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Search for Contact</h4>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
       
      <div class="content">
        <div class="ui grid stackable">
            <div class="sixteen wide column">
                <form class="ui form">
                    <div class="field">
                        <label>Contact Label</label>
                        <div class="field">
                            <div class="CusSelectArrow" tabindex="0"><select>
                                <option value="1">Primary Contact</option>
                                <option value="2">Secondary Contact</option>
                                <option value="3">Technical Director</option>
                                <option value="4">Technical Contact</option>
                                <option value="5">Onsite Contact</option>
                                <option value="6">IT Contact</option>
                                <option value="7">Access Contact</option>
                                <option value="8">Legal Contact</option>
                                <option value="9">Finance Contact</option>
                            </select>
                          </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
        
    </div>
    <div class="newFooter">
        <div class="actions">
            <div class="ui grid">
                <div class="sixteen wide column right aligned">
                    <div class="ui button fluid positive">save</div>
                </div>
            </div>
        </div>
    </div>
</ng-template>


</div>
