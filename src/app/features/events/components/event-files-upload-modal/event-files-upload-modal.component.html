<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Upload Files</h4>
  <button type="button" class="close" aria-label="Close" (click)="checkUploading() && this.closed.emit()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="content uploadDocuments">
    <form class="ui form">
      <div class="ui grid">
        <div class="sixteen wide column adjustableHeightColumn" #fileContainer>
          <div class="field" *ngFor="let existingFile of existingFiles; let i=index">
            <div>
              <p [style.display]="'inline-block'">{{existingFile.displayName}}</p>
              <span [style.marginLeft.px]="20" class="ui tiny green header">Saved</span>
            </div>
            <a *ngIf="!uploadTriggered"
               [style.cursor]="'pointer'"
               (click)="deleteFile(existingFile,i)"
               class="removeDocument">
              <i class="trash alternate icon"></i>
              Delete
            </a>
            <div *ngIf="i<=existingFiles.length-2" class="ui fitted divider"></div>
          </div>
          <div *ngIf="existingFiles.length>0 && selectedFileList.length>0"
               class="ui horizontal divider">New Files</div>
          <div class="field" *ngFor="let listItem of selectedFileList; let i=index">
            <div>
              <p [style.display]="'inline-block'">{{listItem.file.name}}</p>
              <div [style.marginLeft.px]="20" *ngIf="eventFileUploadDeleteService.fileUploadStatus.get(i)?.uploading"
                   class="ui active inline loader"></div>
              <i [style.marginLeft.px]="20" *ngIf="eventFileUploadDeleteService.fileUploadStatus.get(i)?.uploaded"
                 class="check icon"></i>
              <span [style.marginLeft.px]="20" *ngIf="eventFileUploadDeleteService.fileUploadStatus.get(i)?.failed"
                    class="ui tiny red header">Failed</span>
            </div>
            <input [(ngModel)]="listItem.displayName"
                   [ngModelOptions]="{standalone:true}"
                   type="text"
                   placeholder="Display Name"
                   [disabled]="uploadTriggered">
            <a *ngIf="!uploadTriggered"
               [style.cursor]="'pointer'"
               (click)="removeFile(i)"
               class="removeDocument"
               [ngClass]="{disabled:eventFileUploadDeleteService.fileUploadStatus.get(i)?.uploading}">
              <i class="trash alternate icon"></i>
              Remove
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="newFooter">
  <div class="actions">
    <div class="ui grid">
      <div class="eight wide column left aligned">
        <div *ngIf="existingFiles.length<8" appFileUploadTrigger [fileUploadComponentRef]="fileUploadComponent"
             class="ui button positive"
             [ngClass]="{'disabled':selectedFileList.length>=8 || uploadTriggered}">
          Browse and Add
        </div>
        <app-file-upload #fileUploadComponent
                         [config]="fileConfig"
                         [showValidFileTypeList]="false"
                         (fileChange)="fileSelected($event)"
        ></app-file-upload>
      </div>
      <div *ngIf="existingFiles.length<8" class="eight wide column right aligned">
        <div class="ui button positive"
             [ngClass]="{'disabled':selectedFileList.length===0 || uploadTriggered}"
             (click)="uploadSelectedFiles()">Save and Upload
        </div>
      </div>
    </div>
  </div>
</div>
