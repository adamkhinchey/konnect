<div class="ui segment">
  <form class="ui form">
    <div class="ui grid">
      <div class="sixteen wide column">
        <div class="companyContainer marginB20">
          <div class="ui dividing header">
            <h3>Notes to All Venues <i class="cog icon"></i><i
              class="sitemap icon"></i><i
              class="map marker alternate icon"></i></h3>
          </div>
          <div class="field" *ngIf="eventToBeSaved.venues">
            <textarea class="textarea" [(ngModel)]="eventToBeSaved.venues.notesToAll"
            [ngModelOptions]="{standalone:true}"></textarea>
          </div>
        </div>
      </div>
    </div>
  </form>
  <div class="ui grid">
    <div class="sixteen wide column">
      <div class="marginT10"></div>
      <div class="ui button compact addNewVenue addToPanel" (click)="addVenue()"><i
        class="plus circle icon"></i><span class="hideMobile">Add Venue</span>
      </div>
      <h3 id="venuesAnchor" class="ui dividing header">Venues</h3>
      <div class="ui styled fluid accordion parentAccordion parentAccordionVenue">


        <ngb-accordion [closeOthers]="true" (panelChange)="panelChange($event)" #ngbAccordion
                       [activeIds]="'venueListIndex-'+activeVenuePanel" [destroyOnHide]="false">


          <ngb-panel *ngFor="let panel of eventToBeSaved.venues?.list; let i=index"
                     [id]="'venueListIndex-'+i" (shown)="panelActivated(i)">
            <ng-template ngbPanelTitle>
              <i class="dropdown icon"></i>Venue {{i + 1}}
            </ng-template>
            <ng-template ngbPanelContent>
              <div class="content active">
                <form class="ui form visible"
                      style="display: block !important;">
                  <div class="ui grid stackable">
                    <div class="seven wide column">
                      <div class="companyContainer marginB20">
                        <div class="ui dividing header">
                          <h3>Venue Company <i
                            class="globe icon"></i></h3>
                        </div>

                        <div class="kcpCardContainer">
                          <div *ngIf="selectedCompanies && selectedCompanies[i]" class="ui one column grid">
                            <div class="column">
                              <div class="ui fluid card">
                                <div class="content">
                                  <img class="right floated mini ui image"
                                       [src]="getCompanyProfileImage(i) || 'assets/img/default_konnect_img.png'"
                                       appImageFallback fallbackImage="assets/img/default_konnect_img.png">
                                  <div class="header">
                                    <a>{{selectedCompanies[i].companyName}}</a>
                                  </div>
                                  <div class="meta">
                                    <a *ngIf="getCompanyWebsite(i)" [href]="getCompanyWebsite(i)"
                                       target="_blank"> {{getCompanyWebsite(i)}}</a>
                                    <span *ngIf="getCompanyWebsite(i)">|</span>
                                    <a>
                                      <i class="map marker alternate icon"></i>{{selectedCompanies[i].city}}</a>
                                    <span>|</span>
                                    <i class="phone icon"></i>{{getCompanyPhone(i) || ''}}
                                  </div>
                                </div>
                                <div class="extra content" [ngClass]="{'editableObject':false}">
                                  <div class="ui grid">
                                    <div class="ten wide column">

                                    </div>
                                    <div class="six wide column right aligned">
                                      <div (click)="removeSelectedCompany.emit(i)"
                                           class="ui circular compact mini basic button confirmRemove hasModal"
                                           data-modal="removeModal"><i class="trash alternate icon"></i>Remove
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <app-event-assign-function-cmp #venueAssignCmp
                                                     [contactListLabel]="'Venue Contacts'"
                                                     [clientCompanyModal]="searchInviteCmpModal"
                                                     [contactModal]="searchInviteFnCmpCntModal"
                                                     (modalOpen)="setOpenedModalRef($event)"
                                                     (contactRemove)="removeVenueContact(i,$event)"
                      ></app-event-assign-function-cmp>
                      <!--<ng-content select="[assignFunctionCmp]"></ng-content>-->
                      <!--<div class="ui grid center aligned">
                        <div class="sixteen wide column">
                          <div class="ui button basic blue fluid addClient hasModal"
                               data-modal="client"><i
                            class="plus circle icon"></i>Add
                            Venue
                          </div>
                        </div>
                      </div>-->
                      <!--</div>-->
                      <!--<div class="contactsContainer">
                        <div class="ui dividing header">
                          <h3>Venue Contacts <i
                            class="globe icon"></i></h3>
                        </div>
                        <div class="kipCardContainer">
                        </div>
                        <div
                          class="ui grid stackable center aligned">
                          <div class="sixteen wide column">
                            <div class="ui basic button blue fluid addContacts hasModal disabled"
                                 data-modal="contacts">
                              <i
                                class="plus circle icon"></i>Add
                              Contact
                            </div>
                          </div>
                        </div>
                      </div>-->
                    </div>
                    <div class="nine wide column">
                      <app-time-windows
                        (test)="testLogVenue()"
                        [index]="i"
                        [preEventTimes]="eventToBeSaved.venues!.list[i].preEventAccessDateTimes"
                        [postEventTimes]="eventToBeSaved.venues!.list[i].postEventAccessDateTimes"
                        [eventTimes]="eventToBeSaved.venues!.list[i].eventAccessDateTimes"
                      ></app-time-windows>
                      <div class="ui dividing header">
                        <h3>Venue Requirements <i
                          class="cog icon"></i><i
                          class="sitemap icon"></i><i
                          class="map marker alternate icon"></i>
                        </h3>
                      </div>
                      <div class="field">
                        <textarea class="textarea" [(ngModel)]="eventToBeSaved.venues!.list[i].requirements"
                                  [ngModelOptions]="{standalone:true}">
                        </textarea>
                      </div>

                    </div>
                    <div
                      class="sixteen wide column saveButtons paddingT0">
                      <div class="ui divider"></div>
                      <div class="ui grid stackable">
                        <div
                          class="sixteen wide column right aligned">
                          <div class="ui button hasModal"
                               (click)="saveAndInvite.emit({index: activeVenuePanel, shouldInvite:true})"
                               data-modal="inviteModal">Save &amp;
                            Invite
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </ng-template>
          </ngb-panel>


        </ngb-accordion>


      </div>
    </div>
  </div>
</div>
