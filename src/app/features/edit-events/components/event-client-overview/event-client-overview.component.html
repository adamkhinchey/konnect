<div class="ui segment">
  <form class="ui form">
    <div class="ui grid stackable">

  

      <div class="seven wide column">
        <div class="companyContainer marginB20">
          <div class="field checkboxOnHeader">
            <div class="ui dividing header">
              <h3>Client Company <i class="globe icon"></i></h3>
            </div>
            <div class="ui checkbox" (click)="toggleClientOwnCompany()">
              <input type="checkbox" class="hidden" tabindex="0" [(ngModel)]="isOwnCompany"
                [ngModelOptions]="{standalone:true}">
              <label>My company</label>
            </div>
          </div>
          <div class="kcpCardContainer">
            <div *ngIf="selectedCompany" class="ui one column grid">
              <div class="column">
                <div class="ui fluid card">
                  <div class="content">
                    <span *ngIf="selectedCompany.isPrivate && selectedCompany.isSeed == 0" class="ui blue right corner label popupNotes adjustTri"
                      data-content="Private Contact">
                      <!--<i class="address card outline icon"></i>-->
                      <fa-icon [icon]="addressCardIcon"></fa-icon>
                    </span>
                    <img class="right floated mini ui image"
                      [src]="getCompanyProfileImage() || 'assets/img/default_konnect_img.png'" appImageFallback
                      fallbackImage="assets/img/default_konnect_img.png" onerror="src='assets/img/default_konnect_img.png'">
                    <div class="header">
                      <a (click)="goToCompanyProfile(getCompanyId())">{{selectedCompany.companyName}}</a>
                    </div>
                    <div class="meta">
                      <a *ngIf="getCompanyWebsite()" [href]="getCompanyWebsite()"
                         target="_blank"> {{getCompanyWebsite()}}</a>
                      <span *ngIf="getCompanyWebsite()">|</span>
                      <span class="m-0">
                        <i class="map marker alternate icon"></i>{{selectedCompany.city}}</span>
                      <span>|</span>
                      <i class="phone icon"></i>{{getCompanyPhone() || ''}}
                    </div>
                  </div>
                  <div class="extra content" [ngClass]="{'editableObject':false}">
                    <div class="ui grid">
                      <div class="ten wide column">

                      </div>
                  
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <ng-content select="[assignFunctionCmp]"></ng-content>


        <!--</div>-->

      </div>
      <div class="nine wide column">
        <div class="ui dividing header">
          <h3>Event Details <i class="globe icon"></i></h3>
        </div>
        <div class="field required">
          <label>Event Title</label>
          <div class="field">
            <input type="text" placeholder="Event Title" [readonly]="!isClientEdit" [(ngModel)]="eventToBeSaved.title"
              [ngModelOptions]="{standalone:true}">
          </div>
        </div>
        <div class="field">
          <label>Event Description</label>
          <!-- <textarea rows="3" class="textarea" [readonly]="!isClientEdit" [(ngModel)]="eventToBeSaved.description"
            [ngModelOptions]="{standalone:true}"></textarea> -->
            <angular-editor id="evDescription" [(ngModel)]="eventToBeSaved.description" [config]="config" (focus)="changeConfig()" [ngModelOptions]="{standalone: true}"></angular-editor>
        </div>
        <!-- <div class="field">
          <div class="ui toggle checkbox toggleOnColumn"
            (click)="eventToBeSaved.hasExhibitors=!eventToBeSaved.hasExhibitors">
            <input type="checkbox" name="exhibitors" class="hidden" tabindex="0"
              [(ngModel)]="eventToBeSaved.hasExhibitors" [ngModelOptions]="{standalone:true}">
            <label>Event has exhibitors</label>
          </div>
        </div> -->

        <div class="nine wide column" *ngIf="(eventData.eventData.client?.isViewPermission == 1 && eventData.eventData.client?.isSelfIncludedInSection == 1);">
          <div class="ui dividing header">
            <h3>Client Internal Notes <i class="building icon"></i></h3>
          </div>
          <div class="field">
            <!-- <textarea *ngIf="permissionObj.isClient; else no_access" rows="3" class="textarea"
              [readonly]="!isClientEdit" [(ngModel)]="eventToBeSaved.client!.internalCmpNotes"
              [ngModelOptions]="{standalone:true}"></textarea> -->
              <!-- <angular-editor id="ciNotes" *ngIf="permissionObj.isClient; else no_access" [(ngModel)]="eventToBeSaved.client!.internalCmpNotes" [config]="config" (focus)="changeConfig()" [ngModelOptions]="{standalone: true}"></angular-editor> -->
              <angular-editor id="ciNotes" *ngIf="(eventData.eventData.client?.isViewPermission == 1 && eventData.eventData.client?.isSelfIncludedInSection == 1);" [(ngModel)]="eventToBeSaved.client!.internalCmpNotes" [config]="config1" (focus)="changeConfig1()" [ngModelOptions]="{standalone: true}"></angular-editor>
           
          </div>
        </div>

      </div>
    </div>
  </form>
</div>
